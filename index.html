document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>48-hour first drafts<\u002Fdiv>\n          <div style=\"display:flex;gap:11px;font-size:15px;color:rgba(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>Revisions until you're happy<\u002Fdiv>\n          <div style=\"display:flex;gap:11px;font-size:15px;color:rgba(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>Built and published for you<\u002Fdiv>\n          <div style=\"display:flex;gap:11px;font-size:15px;color:rgba(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>Source files handed over<\u002Fdiv>\n          <div style=\"display:flex;gap:11px;font-size:15px;color:rgba(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>Edits to live pages included<\u002Fdiv>\n          <div style=\"display:flex;gap:11px;font-size:15px;color:rgba(245,241,232,.82)\"><span style=\"color:var(--gold,#E8C547)\">✓<\u002Fspan>Cancel or pause anytime<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"border:1px solid rgba(245,241,232,.12);border-radius:12px;padding:30px;background:rgba(245,241,232,.03);flex:1\">\n          <h3 style=\"font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em\">Compare it honestly<\u002Fh3>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:15px;color:rgba(245,241,232,.6);padding:11px 0;border-bottom:1px solid rgba(245,241,232,.1)\"><span>Senior freelancer<\u002Fspan><span style=\"color:rgba(245,241,232,.82)\">$2–5k per page<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:15px;color:rgba(245,241,232,.6);padding:11px 0;border-bottom:1px solid rgba(245,241,232,.1)\"><span>Agency retainer<\u002Fspan><span style=\"color:rgba(245,241,232,.82)\">$6k+ per month<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:15px;color:rgba(245,241,232,.6);padding:11px 0;border-bottom:1px solid rgba(245,241,232,.1)\"><span>In-house designer<\u002Fspan><span style=\"color:rgba(245,241,232,.82)\">$7k+ per month<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:11px 0;color:var(--gold,#E8C547)\"><span>Foldline<\u002Fspan><span style=\"font-weight:600\">$299 per month<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(245,241,232,.12);border-radius:12px;padding:30px;background:rgba(245,241,232,.03)\">\n          <h3 style=\"font-size:19px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em\">Pause, don't cancel<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(245,241,232,.6)\">Between launches? Pause billing and keep your slot for 30 days. No exit call, no retention offer, no contract to read.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"faq\" data-reveal=\"\" style=\"border-top:1px solid rgba(245,241,232,.08);background:#0E0D0B\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:120px 40px\">\n      <div style=\"display:grid;grid-template-columns:.72fr 1.28fr;gap:72px;align-items:start\">\n        <div>\n          <div style=\"font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold,#E8C547);margin-bottom:22px\">Questions<\u002Fdiv>\n          <h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,3.6vw,48px);line-height:1.06;letter-spacing:-.02em;margin:0\">The things people ask before their first brief.<\u002Fh2>\n        <\u002Fdiv>\n        <div>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">What does “one request at a time” mean?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">You can queue as many pages as you like, and we work through them one at a time so nothing sits half-finished. As soon as one is approved, the next starts — most members ship three to five pages a month.<\u002Fp>\n          <\u002Fdetails>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">Do I get a design, or a working page?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">A working page. We design it, you approve it, then we build it and publish it live on your domain — forms connected, analytics wired, mobile checked. You also get the design files and the code.<\u002Fp>\n          <\u002Fdetails>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">What if I don't like the first draft?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">You comment and we revise — as many rounds as it takes, usually same day. Nothing is published until you press approve, and if it's still not right you can pause or cancel before the next month.<\u002Fp>\n          <\u002Fdetails>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">Do you write the copy?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">You bring the substance — the offer, the proof, the objections you hear on calls. We shape it into the headline, the section order and the CTA. You'll never be handed a page full of lorem ipsum.<\u002Fp>\n          <\u002Fdetails>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">Can agencies white-label this?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">Yes, and plenty do. We stay invisible: no branding on your deliverables, and you can invite clients into the portal under your own name.<\u002Fp>\n          <\u002Fdetails>\n          <details style=\"border-top:1px solid rgba(245,241,232,.12);border-bottom:1px solid rgba(245,241,232,.12);padding:26px 0\">\n            <summary style=\"display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em\">What happens to my pages if I cancel?<span style=\"color:var(--gold,#E8C547);font-size:22px\">+<\u002Fspan><\u002Fsummary>\n            <p style=\"font-size:16.5px;line-height:1.65;color:rgba(245,241,232,.64);margin:16px 0 0;max-width:52em\">They're yours and they stay live — the domain, the files and the code were always in your name. Cancel in the dashboard whenever you like; come back when the next page is due.<\u002Fp>\n          <\u002Fdetails>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"start\" data-reveal=\"\" style=\"position:relative;overflow:hidden;border-top:1px solid rgba(245,241,232,.08)\">\n    <div style=\"position:absolute;bottom:-420px;left:50%;transform:translateX(-50%);width:1100px;height:820px;background:radial-gradient(circle at 50% 50%, rgba(232,197,71,.16), rgba(232,197,71,0) 62%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:880px;margin:0 auto;padding:128px 40px;text-align:center\">\n      <h2 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(40px,5.4vw,72px);line-height:1.02;letter-spacing:-.022em;margin:0 0 22px;text-wrap:balance\">Brief us tonight. See it Thursday.<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.6;color:rgba(245,241,232,.66);margin:0 auto 40px;max-width:31em\">Three slots open for September. Leave your email and we'll send the brief form plus two times for a 15-minute intro call.<\u002Fp>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:560px;margin:0 auto\">\n          <input type=\"email\" required=\"\" placeholder=\"you@company.com\" style=\"flex:1;min-width:260px;background:rgba(245,241,232,.05);border:1px solid rgba(245,241,232,.2);border-radius:999px;padding:18px 24px;font-size:16px;color:#F5F1E8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;outline:none\" style-focus=\"border-color:var(--gold,#E8C547)\">\n          <button type=\"submit\" style=\"background:var(--gold,#E8C547);color:#0B0A09;border:none;border-radius:999px;padding:18px 32px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;box-shadow:0 18px 46px -18px rgba(232,197,71,.85);transition:background .18s ease\" style-hover=\"background:var(--gold-deep,#C9A62F)\">Claim a slot<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:520px;margin:0 auto;border:1px solid rgba(232,197,71,.4);background:rgba(232,197,71,.07);border-radius:12px;padding:32px\">\n          <div style=\"font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1.15;margin-bottom:10px\">Slot held for 24 hours.<\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:rgba(245,241,232,.68)\">Check your inbox for the brief form and two call times. Reply with your current page and we'll review it before we talk.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"font-size:13px;letter-spacing:.05em;color:rgba(245,241,232,.42);margin:22px 0 0\">Pause any month · Cancel anytime · 74 members, 318 pages live<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid rgba(245,241,232,.08)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:44px 40px 64px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n      <span style=\"display:flex;align-items:center;gap:10px;font-family:'Instrument Serif',Georgia,serif;font-size:21px\"><span style=\"width:9px;height:9px;background:var(--gold,#E8C547);transform:rotate(45deg);display:inline-block\"><\u002Fspan>Foldline<\u002Fspan>\n      <div style=\"display:flex;gap:28px;font-size:14px\">\n        <a href=\"#work\" style=\"color:rgba(245,241,232,.6)\">Work<\u002Fa>\n        <a href=\"#how\" style=\"color:rgba(245,241,232,.6)\">How it works<\u002Fa>\n        <a href=\"#pricing\" style=\"color:rgba(245,241,232,.6)\">Pricing<\u002Fa>\n        <a href=\"#start\" style=\"color:rgba(245,241,232,.6)\">Claim a slot<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,241,232,.34)\">© 2026 Foldline<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <div data-stickycta=\"\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(14,13,11,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(245,241,232,.12);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;transform:translateY(120%);opacity:0;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s ease\">\n    <span style=\"font-size:15.5px;color:rgba(245,241,232,.72)\"><strong style=\"font-weight:600;color:#F5F1E8\">$299/month, unlimited requests.<\u002Fstrong> Three slots open for September.<\u002Fspan>\n    <a href=\"#start\" style=\"background:var(--gold,#E8C547);color:#0B0A09;font-size:15px;font-weight:600;padding:12px 24px;border-radius:999px\" style-hover=\"background:var(--gold-deep,#C9A62F);color:#0B0A09\">Claim a slot<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8C547&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#E8C547&quot;,&quot;#E8481F&quot;,&quot;#5B8CFF&quot;,&quot;#3DDC97&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;showBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conversion&quot;},&quot;showPricing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conversion&quot;}}\">\nclass Component extends DCLogic {\n  state = { submitted: false };\n\n  componentDidMount() {\n    this.applyAccent();\n    const nav = document.querySelector('[data-nav]');\n    const bar = document.querySelector('[data-stickycta]');\n    this.onScroll = () => {\n      const y = window.scrollY || 0;\n      if (nav) nav.style.borderBottomColor = y > 16 ? 'rgba(245,241,232,.14)' : 'rgba(245,241,232,.08)';\n      if (bar) {\n        const show = y > 900;\n        bar.style.transform = show ? 'translateY(0)' : 'translateY(120%)';\n        bar.style.opacity = show ? '1' : '0';\n      }\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n\n    if ('IntersectionObserver' in window) {\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this.io.unobserve(e.target);\n        });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.03 });\n      document.querySelectorAll('[data-reveal]').forEach((el) => {\n        if (el.getBoundingClientRect().top < window.innerHeight * 0.94) return;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(20px)';\n        el.style.transition = 'opacity .75s cubic-bezier(.2,.7,.2,1), transform .75s cubic-bezier(.2,.7,.2,1)';\n        this.io.observe(el);\n      });\n    }\n  }\n\n  componentDidUpdate() { this.applyAccent(); }\n\n  componentWillUnmount() {\n    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n\n  applyAccent() {\n    const a = this.props.accentColor;\n    if (!a) return;\n    const r = document.documentElement;\n    r.style.setProperty('--gold', a);\n    r.style.setProperty('--gold-deep', a);\n  }\n\n  renderVals() {\n    return {\n      showBadge: this.props.showBadge ?? true,\n      showPricing: this.props.showPricing ?? true,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      submit: (e) => { e.preventDefault(); this.setState({ submitted: true }); }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
